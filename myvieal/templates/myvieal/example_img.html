{% load static %}
<!-- 長々と書いてありますがこれもテストコードなんで消していいよ -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cat_section {
            width: 640px;
            margin: 50px auto 0;
        }
        #bigimg {
            width: 100%;
            aspect-ratio: 3 / 2;
        }
        .three_cat {
            display: flex;
            list-style: none;
            padding: 0;
        }
        li {
            flex: 1;
            margin-right: 8px;
        }
        li:last-of-type {
            margin-right: 0;
        }
        .thumb {
            width: 100%;
            aspect-ratio: 3 / 2;
        }
        .thumb:hover {
            opacity: 0.6;
            transition-duration: 0.6s
        }
    </style>
</head>
<body>
    <main>
        <section class="cat_section">
            <div><img src="{% static "myvieal/img/R.jpg" %}" alt="ぬこ" id="bigimg"></div>
            <ul class="three_cat">
                <li><img src="{% static "myvieal/img/R.jpg" %}" alt="ぬこ" class="thumb" data-image="img1"></li>
                <li><img src="{% static "myvieal/img/cat-2709966_1920-830x510.jpg" %}" alt="ぬこ" class="thumb" data-image="img2"></li>
                <li><img src="{% static "myvieal/img/portrait-sleeping-golden-retriever_1130573-5283.jpg" %}" alt="ぬこ" class="thumb" data-image="img3"></li>
                <li><img src="{% static "myvieal/img/R (1).jpg" %}" alt="ぬこ" class="thumb" data-image="img4"></li>
            </ul>
        </section>
    </main>
    <script>
        'user strict';
        const thumbs = document.querySelectorAll('.thumb');
        thumbs.forEach(function(item, index) {
            item.onclick = function() {
                document.getElementById('bigimg').src = this.src;
            }
        });
    </script>
</body>
</html>
