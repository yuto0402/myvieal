{% extends "myvieal/base.html" %}
{% load static %}
{% load widget_tweaks %}

{% block extra-style %}
<link rel="stylesheet" href="{% static 'myvieal/css/create.css' %}">
{% endblock %}

{% block header-container %}
  <a href="{% url 'top' %}" class="top">×</a>
  <h3>動画の投稿</h3>
  <p class="post">投稿</p>
{% endblock %}

{% block content %}
<main>
  <form action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="thumbnail">{{ form.thumbnail }}</div>
    <div class="movie">
      <p>動画ファイル <span class="requirement">必須</span></p>
      <input type="file" id="file-input" name="movie_file" class="movie" style="display: none;" required>
      <div class="button-container">
        <label for="file-input" class="movie_select">動画を選択</label>
      </div>
      <video class="video-preview" style="display:none" type="video/mp4">
    </div>
    <div class="title">
      <p>タイトル <span class="requirement">必須</span></p>
      <textarea name="title" required placeholder="タイトルを入力"></textarea>
    </div>
    <div class="explanation">
      <p>詳細文 <span class="requirement">必須</span></p>
      <textarea name="explanation" required placeholder="詳細文を入力"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">投稿</button>
  </form>
</main>
<script src="{% static 'myvieal/js/create.js' %}"></script>
{% endblock %}
